<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Gulir · Preview</title><link rel="stylesheet" href="preview.css"><body><main><header><span class="brand">GULIR</span><h1>Screenshot siap disimpan.</h1><p id="summary">Memuat preview…</p></header><section class="panel"><form id="form"><label>Nama file (PNG)<input id="name" maxlength="120" required></label><label>Subfolder di Downloads<input id="folder" placeholder="Screenshots/Proyek" maxlength="160"><small>Kosongkan untuk folder Downloads utama. Pilihan terakhir diingat.</small></label><div class="buttons"><button id="save" disabled>Simpan PNG</button><button type="button" id="discard" class="secondary">Hapus preview</button><button type="button" id="shortcut" class="secondary">Atur shortcut</button></div></form><p role="status" id="status" aria-live="polite"></p><p class="note">Hasil disimpan sebagai satu PNG utuh. Muat konten lazy-load dahulu. Selama pengambilan, jangan berpindah tab atau menggulir. Video, animasi, dan area scroll di dalam halaman memiliki keterbatasan.</p><p id="keys" class="note"></p></section><section id="images" aria-label="Preview screenshot"></section></main><script type="module" src="preview.js"></script></body></html>
